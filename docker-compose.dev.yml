# Local development dependencies only — the databases the services expect.
# The services themselves run from IntelliJ (see .idea/runConfigurations) or
# from scripts/dev.sh, so they can be restarted individually.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # keeps data
#   docker compose -f docker-compose.dev.yml down -v     # wipes data

services:
  mongo:
    image: mongo:8
    container_name: moviedb-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17
    container_name: moviedb-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The image only creates one database from POSTGRES_DB, so both are
      # created by the init script below instead.
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
  postgres-data:
