server:
  port: 8760
spring:
  main:
    allow-bean-definition-overriding: true

  config:
    # FIREBASE_PROJECT_ID; see secrets/README.md. Env vars override it.
    import: optional:file:${SECRETS_DIR:../secrets}/local.env[.properties]

  security:
      oauth2:
        resourceserver:
          jwt:
            jwk-set-uri: ${JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
            issuer-uri: https://securetoken.google.com/${FIREBASE_PROJECT_ID:}

  application:
    name: gateway

  cloud:
    gateway:
      # Spring Cloud Gateway 4.3 moved this whole namespace under
      # server.webflux. The old spring.cloud.gateway.* keys still bind via
      # deprecated aliases but warn on every start.
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
          discovery:
            locator:
              enabled: true
              lowerCaseServiceId: true
          routes:
              - id: ${EUREKA_INSTANCE_HOSTNAME_MOVIE_SERVICE:movie-service}
                uri: lb://${EUREKA_INSTANCE_HOSTNAME_MOVIE_SERVICE:MOVIE-SERVICE}
                predicates:
                  - Path=/movies/**
              - id: ${EUREKA_INSTANCE_HOSTNAME_ORDER_SERVICE:order-service}
                uri: lb://${EUREKA_INSTANCE_HOSTNAME_ORDER_SERVICE:ORDER-SERVICE}
                predicates:
                  - Path=/orders/**
              - id: ${EUREKA_INSTANCE_HOSTNAME_INVENTORY_SERVICE:inventory-service}
                uri: lb://${EUREKA_INSTANCE_HOSTNAME_INVENTORY_SERVICE:INVENTORY-SERVICE}
                predicates:
                  - Path=/inventory/**
              - id: ${EUREKA_INSTANCE_HOSTNAME_USER_SERVICE:user-service}
                uri: lb://${EUREKA_INSTANCE_HOSTNAME_USER_SERVICE:USER-SERVICE}
                predicates:
                  - Path=/user/**

app:
  firebase:
    # Kept out of the repo and the jar; see secrets/README.md.
    service-account: ${FIREBASE_SERVICE_ACCOUNT:file:${SECRETS_DIR:../secrets}/firebase-service-account.json}

eureka:
  instance:
    # Same template the four domain services use, so the gateway reports a
    # stable id rather than falling back to Eureka's default format.
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    healthcheck:
      enabled: true

management:
  endpoint:
    gateway:
      # Boot 3.5 replaced management.endpoint.<id>.enabled with .access
      access: unrestricted
  endpoints:
    web:
      exposure:
        include:
          - gateway
          - mappings
          - env
          - health
          - info