app:
  firebase:
    # Kept out of the repo and the jar; see secrets/README.md.
    service-account: ${FIREBASE_SERVICE_ACCOUNT:file:${SECRETS_DIR:../secrets}/firebase-service-account.json}

spring:
  application:
    name: ${EUREKA_INSTANCE_HOSTNAME:user-service}

  data:
    mongodb:
      database: ${MONGO_DB:userdb}
      uri: ${MONGO_URI:mongodb://localhost:27017}

# Only this machine can reach the service: outside callers go through the
# gateway, which is the only thing that may set the uid header the
# controllers trust. SERVER_ADDRESS / GRPC_ADDRESS / INSTANCE_HOST open it
# up again where a private network does that job (e.g. containers).
server:
  address: ${SERVER_ADDRESS:127.0.0.1}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
    preferIpAddress: ${PREFER_IP_ADDRESS:false}
    # Registered as loopback, matching server.address: the gateway and gRPC
    # clients on this machine connect there, whatever the Wi-Fi address is.
    hostname: ${INSTANCE_HOST:127.0.0.1}
    ip-address: ${INSTANCE_HOST:127.0.0.1}

grpc:
  server:
    port: ${GRPC_PORT:0}
    address: ${GRPC_ADDRESS:127.0.0.1}
  client:
    movie-grpc-server:
      address: ${GRPC_MOVIE_ADDRESS:discovery:///movie-service}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

management:
  # NOTE: "endpoints" (plural) is the correct key. This previously read
  # "endpoint.web.exposure", which Spring ignores, so the "*" never applied.
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      # Boot 3.5 replaced management.endpoint.<id>.enabled with .access
      access: unrestricted
  health:
    circuitbreakers:
      enabled: true
    ratelimiter:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 60s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.RestClientException
          - org.springframework.web.client.HttpStatusCodeException
          - org.springframework.web.client.RestClientResponseException
          - org.springframework.web.client.UnknownHttpStatusCodeException
          - org.springframework.web.client.RestClientException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.RestClientException
          - org.springframework.web.client.HttpStatusCodeException
          - org.springframework.web.client.RestClientResponseException
          - org.springframework.web.client.UnknownHttpStatusCodeException
          - org.springframework.web.client.RestClientException

      CircuitBreakerService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 60s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10

  retry:
    instances:
      RetryService:
        maxAttempts: 3
        waitDuration: 1s

    metrics:
      enabled: true

  timelimiter:
    instances:
      TimeLimiterService:
        timeoutDuration: 5s
        cancelRunningFuture: true
        eventConsumerBufferSize: 10

  bulkhead:
    instances:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0s
        eventConsumerBufferSize: 10

  ratelimiter:
    instances:
      RateLimiterService:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

